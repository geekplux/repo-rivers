<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Applies a stored light/dark choice before first paint (external: the CSP allows no inline script). -->
    <script src="/theme.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The faces above the fold (body, headline, its italic, river names), so text is set once: no layout shift. -->
    <link rel="preload" href="/fonts/alegreya-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/alegreya-sans-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/alegreya-sans-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/alegreya-sans-500-italic.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="See a GitHub repository's history as rivers of modules and contributors." />
    <title>Repo Rivers</title>
    <!-- Link previews (Open Graph, X): a 1200 × 630 card, and the same card moving as og:video for the
         platforms that play it (iMessage, Discord); the rest show og:image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Repo Rivers" />
    <meta property="og:title" content="Repo Rivers" />
    <meta property="og:description" content="See a GitHub repository's history as rivers of modules and contributors." />
    <meta property="og:url" content="https://reporivers.geekplux.com/" />
    <meta property="og:image" content="https://reporivers.geekplux.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Repo Rivers: a repository's history drawn as rivers of modules that widen, merge and split over the years." />
    <meta property="og:video" content="https://reporivers.geekplux.com/og.mp4" />
    <meta property="og:video:secure_url" content="https://reporivers.geekplux.com/og.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
